# The E2E tier in automation (FR-088).
#
# It keeps its own file because `ci.yml` calls it as the `e2e` job, and only a job `ci.yml` calls
# can be a dependency of `ci-required`. A second required check would defeat FR-091's single
# visible gate (contracts/ci.md).
#
# The harness is unchanged from what a developer runs: it nests a Hyprland inside whatever session
# it is given. On a developer's machine that is their desktop; here it is one the container starts
# for itself, which needs a virtual GPU and a seat — a plain container cannot start Hyprland at
# all, measured in research.md R29.
name: e2e

on:
  workflow_call:
  # Runnable on its own as well as through `ci.yml`. This tier is the one whose failures are most
  # often the environment rather than the change (research.md R29), and re-running it alone is a
  # great deal faster than re-running the whole gate to reach it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `vkms` is R29's first route: a synthetic DRM device published by the runner's own kernel,
      # the container running against it with its own seatd. Fewest moving parts.
      #
      # A hosted runner does not carry the module — measured 2026-09-02, `modprobe: FATAL: Module
      # vkms not found in directory /lib/modules/6.17.0-1022-azure`. It ships in
      # `linux-modules-extra` for the running kernel, which is in the archive, so the module is
      # installed rather than assumed. If *that* fails, R29's second route is a QEMU virtual machine
      # with `virtio-gpu` — what upstream Hyprland's own CI uses — and the failure below says which
      # happened, because it is an environment failure and not a test result.
      - name: Publish a virtual GPU
        id: gpu
        run: |
          set -eu
          fail() {
            echo "::error::$1 — the runner has no DRM device for the compositor to open. This is a broken environment, not a broken change (research.md R29 names the QEMU/virtio-gpu fallback)."
            exit 1
          }
          if ! sudo modprobe vkms 2>/dev/null; then
            echo "vkms is not in this kernel's module directory; installing it for $(uname -r)"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" \
              || fail "linux-modules-extra-$(uname -r) is not installable"
            sudo modprobe vkms || fail "vkms is installed but will not load"
          fi
          # What the DRM backend will actually find. vkms is a display-only driver, so a `card*`
          # with no `renderD*` beside it is the expected shape and is recorded here: if the
          # compositor then fails on an allocator, this line is the evidence for why.
          ls -l /dev/dri || fail "vkms loaded but published no device node"

      # One image, built from the same Dockerfile a contributor builds, so an automation failure
      # reproduces locally (FR-089, SC-035). Built here rather than pulled so that a change to the
      # Dockerfile is verified by the change that makes it.
      - name: Build the E2E image
        run: docker build -t hypr-swap-e2e docker/e2e

      # T045 / contracts/ci.md: the parent session is asserted **before** the suite runs. The image
      # resolves a session and then executes whatever it is given, so `true` is exactly the probe —
      # same code path, no test. Status 78 is the entry point's environment failure.
      - name: Assert the parent session is up
        run: |
          set -eu
          status=0
          # `--privileged` because seatd must open the DRM device as a session leader, and
          # `--user root` because seatd must start before the entry point drops to the
          # unprivileged user the compositor runs as (research.md R30).
          # Redirected to a file and echoed afterwards, never piped: `docker run … | tee` makes
          # the pipeline return *tee's* status, so a `|| status=$?` on it never fires and the step
          # passes whatever the container did. That is not a hypothetical — it turned this job
          # green for one commit while the suite ran for two seconds [CI 2026-09-02].
          docker run --rm --privileged --user root \
            -v "$PWD:/work" -w /work \
            hypr-swap-e2e true > session.log 2>&1 || status=$?
          cat session.log
          if [ "$status" -eq 0 ]; then
            echo "the parent session comes up"
            exit 0
          fi

          # Why it did not come up, in an **annotation** rather than only in the log. A job log
          # needs repository admin to read; annotations are public on a public repository, so this
          # is the difference between a maintainer being able to diagnose a runner failure from a
          # link and having to have push rights first. The lines worth keeping are the compositor's
          # own errors and this script's own notes; `%0A` is how a multi-line annotation is written.
          # The render-node lines are kept as well as the errors: they are what distinguishes a
          # node that could not be opened from one libdrm could not describe, and the run that
          # dropped them could not tell the two apart.
          reason="$(grep -aE 'ERR|CRIT|ASSERTION|Couldn.t|e2e-env:|failed|render node|openRenderNode|RENDERNODEFD|DRMFD' session.log \
                    | tail -n 40 | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')"
          if [ "$status" -eq 78 ]; then
            echo "::error::the E2E environment did not come up: no Wayland session could be started in the container. This is a broken runner, not a broken change.%0A%0A${reason}"
          else
            echo "::error::the E2E image failed to start (status $status) — this is a broken runner, not a broken change.%0A%0A${reason}"
          fi
          exit 1

      - name: Run the E2E suite
        run: |
          set -eu
          status=0
          docker run --rm --privileged --user root \
            -v "$PWD:/work" -w /work \
            hypr-swap-e2e > suite.log 2>&1 || status=$?
          cat suite.log
          if [ "$status" -eq 78 ]; then
            reason="$(grep -aE 'ERR|CRIT|ASSERTION|e2e-env:' suite.log \
                      | tail -n 40 | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')"
            echo "::error::the E2E environment failed after the probe passed — a broken runner, not a broken change.%0A%0A${reason}"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            # A real test failure: the failing test names, not the environment.
            # The panic text as well as the test names: a failure's *reason* is in the
            # `panicked at` line and whatever the test printed beside it, and a filter that keeps
            # only the headers reports which tests failed without saying why.
            reason="$(grep -aE '^(test .*FAILED|failures:|---- )|^test result|panicked at|assertion|SC-[0-9]|budget|left:|right:' suite.log \
                      | tail -n 45 | sed 's/%/%25/g; s/\r/ /g' | awk '{printf "%s%%0A", $0}')"
            echo "::error::the E2E suite failed.%0A%0A${reason}"
            exit "$status"
          fi

          # A zero status is not evidence on its own: a suite that ran nothing exits zero too, and
          # that is precisely how a masked failure got past this job once. Count what actually ran
          # — a gate that passes because a check did not run is not a gate (the same rule
          # `ci-required` applies to a skipped job).
          passed="$(awk '/^test result: ok\./ {total += $4} END {print total + 0}' suite.log)"
          echo "the suite reported $passed passing tests"
          if [ "$passed" -lt 50 ]; then
            echo "::error::the E2E suite exited 0 having reported only $passed passing tests; the tier runs 86. The suite did not run, so this job proved nothing.%0A%0A$(tail -n 20 suite.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: How to reproduce this
        if: failure()
        run: |
          echo "::error::reproduce locally against your own Wayland session with: docker build -t hypr-swap-e2e docker/e2e && docker run --rm --device /dev/dri/renderD128 -e WAYLAND_DISPLAY=\"\$WAYLAND_DISPLAY\" -v \"\$XDG_RUNTIME_DIR:/run/host\" -e XDG_RUNTIME_DIR=/run/host -v \"\$PWD:/work\" -w /work hypr-swap-e2e"
