[package]
name = "hypr-swap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Alt-Tab style workspace switcher with cross-monitor swapping for Hyprland"
license = "MIT"

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.21", features = ["calloop", "xkbcommon"] }
cairo-rs = "0.22"
pango = "0.22"
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
# A proc-macro crate in this line: it expands the vendored protocol XML at compile time rather
# than generating a file, so it is a normal dependency and build.rs only triggers rebuilds.
wayland-scanner = "0.31"

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
xkbcommon = "0.8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
