[package]
name = "hypr-swap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
# The copyright holder LICENSE names. cargo-deb reads this to write the `Copyright:` line of the
# Debian `copyright` file; without it the generated file says the information is missing.
authors = ["SerafAC <seraf_ac@hotmail.com>"]
description = "Alt-Tab style workspace switcher with cross-monitor swapping for Hyprland"
license = "MIT"
# What a packager and a source index expect to find here (FR-065, contracts/packaging.md). The
# licence above is the one LICENSE spells out and the one the `licence-files` check compares
# against; `documentation` is the published site, which is where a reader is sent for anything
# longer than the README.
repository = "https://github.com/SerafAC/hypr-swap"
documentation = "https://serafac.github.io/hypr-swap/"
homepage = "https://serafac.github.io/hypr-swap/"
readme = "README.md"
keywords = ["hyprland", "wayland", "workspace", "switcher", "alt-tab"]
categories = ["command-line-utilities", "gui", "os::linux-apis"]

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.21", features = ["calloop", "xkbcommon"] }
cairo-rs = { version = "0.22", features = ["png"] }
pango = "0.22"
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
# A proc-macro crate in this line: it expands the vendored protocol XML at compile time rather
# than generating a file, so it is a normal dependency and build.rs only triggers rebuilds.
wayland-scanner = "0.31"
# Vector icon rasterisation, and the only new dependency this project takes (research.md R18,
# plan.md Complexity Tracking). Every optional feature stays off: `text` and `system-fonts` would
# pull a font stack in to render `<text>` elements that application icons do not carry, and `svgz`
# a decompressor for a format essentially no installed icon set uses.
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
xkbcommon = "0.9"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true

# --------------------------------------------------------------------------------------------
# The distribution packages (FR-106, FR-109, research.md R33). Both recipes read this file's one
# `version`, so raising it in a release raises it everywhere (FR-105), and both write the install
# map of [contracts/packaging.md] — the same five files, at each family's conventional paths.
#
# Neither is built here: the release workflow runs them inside a container of the oldest
# still-supported release of each family, because what a dynamically linked binary can run on is
# decided by the glibc it was built against (FR-109a, research.md R34).
#
# [contracts/packaging.md]: specs/003-oss-release-readiness/contracts/packaging.md
# --------------------------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "SerafAC <seraf_ac@hotmail.com>"
# /usr/share/doc/hypr-swap/copyright is where the Debian family looks for the licence (FR-066).
# cargo-deb writes a short DEP-5 header — format, upstream name, source, holder, licence — and
# then this file's full text beneath it; the `0` says skip no lines, because LICENSE is the
# licence and nothing else.
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
An overlay listing every workspace and the windows it contains, shown while a modifier is held \
and committed the moment it is released. A second shortcut swaps the highlighted workspace with \
the one on the focused monitor. The daemon is started from the user's hyprland.conf; it installs \
no unit file and needs no configuration."""
# Stated rather than left to `$auto`, so the contract and the package cannot disagree. Hyprland is
# deliberately absent: pinning a compositor version would refuse installs the program supports.
depends = "libcairo2, libpango-1.0-0, libpangocairo-1.0-0, libc6"
recommends = "libnotify-bin"
assets = [
    ["target/release/hypr-swap", "usr/bin/hypr-swap", "755"],
    ["README.md", "usr/share/doc/hypr-swap/README.md", "644"],
    ["THIRD-PARTY.md", "usr/share/doc/hypr-swap/THIRD-PARTY.md", "644"],
    # Debian policy keeps the *upstream* changelog at changelog.gz, compressed. cargo-deb copies
    # an asset verbatim rather than compressing it, so the release workflow gzips CHANGELOG.md to
    # this path immediately before it packages (`.github/workflows/release.yml`, the deb step);
    # `cargo deb` run by hand without that step fails naming this file, which is the intended
    # answer rather than a package carrying plain text under a .gz name.
    ["target/changelog.gz", "usr/share/doc/hypr-swap/changelog.gz", "644"],
]
revision = ""

[package.metadata.generate-rpm]
summary = "Alt-Tab style workspace switcher with cross-monitor swapping for Hyprland"
# The RPM family keeps the licence under /usr/share/licenses and the rest under /usr/share/doc.
assets = [
    { source = "target/release/hypr-swap", dest = "/usr/bin/hypr-swap", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/hypr-swap/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/hypr-swap/README.md", mode = "644", doc = true },
    { source = "THIRD-PARTY.md", dest = "/usr/share/doc/hypr-swap/THIRD-PARTY.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/hypr-swap/CHANGELOG.md", mode = "644", doc = true },
]

# Stated for the same reason as the Debian list above; Hyprland is deliberately absent from both.
[package.metadata.generate-rpm.requires]
cairo = "*"
pango = "*"

[package.metadata.generate-rpm.suggests]
libnotify = "*"
