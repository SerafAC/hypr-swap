<!--
  Provenance (FR-063), accounted for in THIRD-PARTY.md at the repository root:
  written for this project — no upstream — © 2026 SerafAC, MIT, the same terms as LICENSE.

  The generic icon for a program whose own icon could not be resolved (FR-041).

  Drawn as a window frame rather than a question mark: an unresolved icon is a normal outcome, not
  an error, and the entry it sits in is still a perfectly usable window.

  Constraints this file has to meet, because of how it is used:
    * Geometry only. `resvg` is built without its `text` feature (research.md R18), so a <text>
      element here would silently render as nothing.
    * One flat colour and a square viewBox. The placeholder is tinted to the theme's primary text
      colour (FR-051), which is done by using its alpha as a mask, so only the coverage matters —
      the black below never reaches the screen.
    * Legible at the icon slot's real size, which follows the text height (FR-052) and so is around
      20 logical pixels. Hence thick strokes and generous corner radii.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <g fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.5" y="8.5" width="35" height="31" rx="5"/>
    <path d="M6.5 18.5 H41.5"/>
  </g>
  <g fill="#000000">
    <circle cx="12.5" cy="13.5" r="1.75"/>
    <circle cx="18.5" cy="13.5" r="1.75"/>
  </g>
</svg>
