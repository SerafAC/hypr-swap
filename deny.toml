# cargo-deny: the advisory watch (FR-093) and the dependency-licence position (FR-064), from one
# file (research.md R38).
#
#     cargo deny check advisories
#     cargo deny check licenses
#
# The two differ in whether they gate, and that is the only thing about them worth remembering.
# The advisory check is **informational** in automation: an advisory is news about the world, not a
# defect in the change under review, and blocking every contributor on someone else's disclosure is
# how a project learns to ignore red (contracts/ci.md).
#
# What *is* gating is the expiry of an acceptance. cargo-deny has no built-in expiry, so the time
# bound lives in the `reason` string it does support, and a unit test in `src/lib.rs` fails once
# the date has passed or the form is wrong. An advisory can be accepted deliberately; it cannot be
# forgotten.
#
# The site's npm tree is not covered here — cargo-deny reads Cargo metadata only. It is watched by
# Dependabot's `npm` ecosystem entry instead; the asymmetry is deliberate and stated in R38.

[advisories]
# Every advisory is a finding. Nothing is filtered by kind, so an unmaintained crate or a yanked
# version is surfaced by the same run that surfaces a vulnerability.
version = 2

# Accepted advisories, each one bounded in time.
#
# An entry's `reason` MUST begin `until YYYY-MM-DD:` followed by why it is accepted — the date
# being when the acceptance stops being true, not when anyone promises to look. The unit test
# `advisory_acceptances_are_bounded_and_current` in `src/lib.rs` fails the `unit` job on any other
# form, and on any date that has passed.
#
# Example of the required shape:
#
#     { id = "RUSTSEC-0000-0000", reason = "until 2026-12-31: no fixed release exists upstream; the
#       affected path is not reachable from this program." }
ignore = []

# --------------------------------------------------------------------------------------------
# The dependency-licence position (FR-064, research.md R38).
#
#     cargo deny check licenses
#
# This one **gates**, unlike the advisory check above, and the difference is not arbitrary: an
# advisory is news about the world, whereas a dependency arriving under an unexpected licence is a
# property of the change under review, and the contributor who added it is the person who can
# answer for it.
#
# The list below is what makes THIRD-PARTY.md's "every licence in the graph is permissive"
# statement true rather than aspirational. Adding a licence here is a deliberate act: it changes
# what the project tells a packager they are redistributing, so THIRD-PARTY.md's table changes in
# the same commit.
# --------------------------------------------------------------------------------------------

[licenses]
version = 2

# Exactly what the graph contains today — build-time, runtime and development dependencies alike.
# Every one is permissive; none is copyleft. A crate introducing anything else fails the gate.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Development dependencies are read too. They are not redistributed, so this is stricter than it
# has to be — but "the whole graph" needs no footnote explaining what was left out of it, and the
# E2E harness's dependencies are as much a contributor's concern as the shipped ones.
include-dev = true
