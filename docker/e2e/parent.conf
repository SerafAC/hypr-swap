# The parent compositor the image starts for itself when no session is handed in (research.md
# R29's automation path). It exists only to be a session: the suite's own nested instance brings
# its own generated configuration, and nothing here is asserted on.
monitor = , preferred, auto, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Nothing should grab this compositor's input: the harness drives the nested instance underneath.
input {
    follow_mouse = 0
}

# Hyprland disables its own stdout logging a few lines into start-up and continues into a file, so
# a parent that dies during start-up reports a crash with no reason attached — which is exactly
# what the first CI run produced. This is a throwaway compositor whose only job is to be a session:
# there is nothing to keep quiet for, and the log is the whole value when it fails.
debug {
    disable_logs = false
    enable_stdout_logs = true
}
