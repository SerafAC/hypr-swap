# The parent compositor the image starts for itself when no session is handed in (research.md
# R29's automation path). It exists only to be a session: the suite's own nested instance brings
# its own generated configuration, and nothing here is asserted on.
monitor = , preferred, auto, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Nothing should grab this compositor's input: the harness drives the nested instance underneath.
input {
    follow_mouse = 0
}
